services:
  app:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8001}
    image: kr2-app:1.0
    env_file: .env
    environment:
      REDIS_HOST: redis
      STUDENT: Chugunov
      APP_PORT: ${APP_PORT:-8001}
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:${APP_PORT:-8001}"
    networks: [backend, ingress]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: false
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  redis:
    image: redis:7-alpine
    env_file: .env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
networks:
  backend:
    internal: true
  ingress: {}
volumes:
  redis_data:
