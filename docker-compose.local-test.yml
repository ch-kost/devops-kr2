# Local Docker Desktop verification only; final VM uses nginx/kr2.conf.template.
services:
  nginx:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/kr2/nginx.conf", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    volumes:
      - local_certs:/etc/kr2:ro
    networks: [ingress]
    depends_on: [app]
volumes:
  local_certs:
    external: true
    name: kr2-chugunov-local-certs
